<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Art lab</title>
<link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/art.css">
<style>body{padding:20px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}.cardx{border:1px solid #ddd;border-radius:16px;padding:8px;height:420px;display:flex;flex-direction:column}.cardx .art{flex:1;min-height:0}.cardx p{margin:4px;font:600 14px sans-serif}.big .cardx{height:760px}</style></head>
<body><div id="defs"></div><div class="grid" id="g"></div>
<script type="module">
import { art, artDefs } from '/src/art/index.js';
document.getElementById('defs').innerHTML = artDefs();
const ids = (new URLSearchParams(location.search).get('s') || '').split(',').filter(Boolean);
if (new URLSearchParams(location.search).has('big')) document.body.classList.add('big');
document.getElementById('g').innerHTML = ids.map(id => `<div class="cardx live play"><p>${id}</p>${art(id)}</div>`).join('');
</script></body></html>
